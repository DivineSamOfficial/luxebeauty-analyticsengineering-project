
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'lb_analytics_core'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'lb_analytics_core'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  lb_analytics_core:

    # BASE (bronze): 1:1 with source tables. Rename + cast only.
    base:
      +schema: base
      +materialized: view
      master_data:
        +tags: ["master_data"]
      sales:
        +tags: ["sales"]
      invoicing:
        +tags: ["invoicing"]
      shipping:
        +tags: ["shipping"]
      returns:
        +tags: ["returns"]
      inventory:
        +tags: ["inventory"]

    # STAGING (silver): cleaned, business-ready entities.
    staging:
      +schema: staging
      +materialized: view
      master_data:
        +tags: ["master_data"]
      sales:
        +tags: ["sales"]
      invoicing:
        +tags: ["invoicing"]
      shipping:
        +tags: ["shipping"]
      returns:
        +tags: ["returns"]
      inventory:
        +tags: ["inventory"]

    # INTERMEDIATE: reusable joins/logic, inlined as CTEs (no DB object).
    intermediate:
      +materialized: ephemeral
      sales:
        +tags: ["sales"]

    # MARTS (gold): what dashboards query.
    marts:
      +schema: marts
      +materialized: table
      dim:
        +tags: ["dim"]
      sales:
        +tags: ["sales"]
      supply_chain:
        +tags: ["supply_chain"]